<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantasha World Learn — AI Tutor in Your Own Language</title>
<meta name="description" content="World's most affordable AI tutor. Learn any subject — Physics, Chemistry, Math, Programming and more — in your own language including Hindi, Urdu, Arabic and 13+ others. Free to start.">
<meta name="keywords" content="AI tutor, online learning, study notes, quiz generator, multilingual education, Mantasha World Learn">
<meta name="author" content="Mantasha Tehreem">
<meta property="og:title" content="Mantasha World Learn — AI Tutor in Your Own Language">
<meta property="og:description" content="World's most affordable AI tutor. Learn any subject in your own language — free to start.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mantasha-world-learn.vercel.app">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Mantasha World Learn — AI Tutor in Your Own Language">
<meta name="twitter:description" content="World's most affordable AI tutor. Learn any subject in your own language — free to start.">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://js.puter.com/v2/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0c29;color:#f0f0ff;font-family:'Segoe UI',sans-serif;min-height:100vh}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;
const LANGS=[{code:"en",name:"English",flag:"🇬🇧"},{code:"hi",name:"Hindi",flag:"🇮🇳"},{code:"ur",name:"Urdu",flag:"🇵🇰"},{code:"ar",name:"Arabic",flag:"🇸🇦"},{code:"es",name:"Spanish",flag:"🇪🇸"},{code:"fr",name:"French",flag:"🇫🇷"},{code:"bn",name:"Bengali",flag:"🇧🇩"},{code:"sw",name:"Swahili",flag:"🇰🇪"}];
const SUBJECTS=["Physics","Chemistry","Biology","Mathematics","History","Geography","English","Programming","Economics","Psychology"];
const TABS=[{id:"home",icon:"🏠",label:"Home"},{id:"tutor",icon:"🤖",label:"AI Tutor"},{id:"quiz",icon:"📝",label:"Quiz"},{id:"notes",icon:"📚",label:"Notes"}];
async function callClaude(system,msg){
const response=await puter.ai.chat(`${system}\n\n${msg}`,{model:"claude-sonnet-4-6"});
if(typeof response==="string")return response;
if(response?.message?.content?.[0]?.text)return response.message.content[0].text;
if(response?.text)return response.text;
return String(response);
}
const FREE_LIMIT=5;
function todayKey(){const d=new Date();return `usage_${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;}
async function getUsage(){try{const v=await puter.kv.get(todayKey());return v?parseInt(v):0;}catch(e){return 0;}}
async function incUsage(){try{await puter.kv.incr(todayKey());}catch(e){}}
async function getPremium(){try{const v=await puter.kv.get('premium');return v==='true';}catch(e){return false;}}
async function setPremium(){try{await puter.kv.set('premium','true');}catch(e){}}
function App(){
const [tab,setTab]=useState("home");
const [lang,setLang]=useState(LANGS[0]);
const [subject,setSubject]=useState("Physics");
const [chat,setChat]=useState([]);
const [q,setQ]=useState("");
const [loading,setLoading]=useState(false);
const [quiz,setQuiz]=useState(null);
const [qTopic,setQTopic]=useState("");
const [sel,setSel]=useState({});
const [done,setDone]=useState(false);
const [score,setScore]=useState(0);
const [nTopic,setNTopic]=useState("");
const [notes,setNotes]=useState("");
const [isPremium,setIsPremium]=useState(false);
const [usageLeft,setUsageLeft]=useState(FREE_LIMIT);
const [showUpgrade,setShowUpgrade]=useState(false);

React.useEffect(()=>{
(async()=>{
const prem=await getPremium();setIsPremium(prem);
if(!prem){const used=await getUsage();setUsageLeft(Math.max(0,FREE_LIMIT-used));}
})();
},[]);

async function checkAndUseCredit(){
if(isPremium)return true;
const used=await getUsage();
if(used>=FREE_LIMIT){setShowUpgrade(true);return false;}
await incUsage();
setUsageLeft(Math.max(0,FREE_LIMIT-used-1));
return true;
}

async function upgradeSuccess(){
await setPremium();
setIsPremium(true);
setShowUpgrade(false);
}

async function ask(){
if(!q.trim()||loading)return;
const ok=await checkAndUseCredit();if(!ok)return;
const question=q;setQ("");setLoading(true);
setChat(h=>[...h,{r:"user",t:question}]);
try{const a=await callClaude(`You are Mantasha World Learn AI tutor. Reply ONLY in ${lang.name} language. Be friendly and clear for students.`,`Subject:${subject}\nQuestion:${question}`);
setChat(h=>[...h,{r:"ai",t:a}]);}catch(e){setChat(h=>[...h,{r:"ai",t:"Error! Try again."}]);}
setLoading(false);}

async function genQuiz(){
if(!qTopic.trim()||loading)return;
const ok=await checkAndUseCredit();if(!ok)return;
setLoading(true);setQuiz(null);setDone(false);setSel({});setScore(0);
try{const raw=await callClaude(`Generate 5 MCQs in ${lang.name}. Return ONLY JSON array. No markdown.`,`Subject:${subject},Topic:${qTopic}\nFormat:[{"q":"question","options":["A","B","C","D"],"answer":"A","explanation":"why"}]`);
const clean=raw.replace(/\`\`\`json|\`\`\`/g,"").trim();
setQuiz(JSON.parse(clean));}catch(e){alert("Error! Try again.");}
setLoading(false);}

async function genNotes(){
if(!nTopic.trim()||loading)return;
const ok=await checkAndUseCredit();if(!ok)return;
setLoading(true);
try{const n=await callClaude(`Write study notes in ${lang.name} for students. Use bullet points and clear headings.`,`Subject:${subject},Topic:${nTopic}`);
setNotes(n);}catch(e){alert("Error!");}
setLoading(false);}

function submit(){let s=0;quiz.forEach((q,i)=>{if(sel[i]===q.answer)s++;});setScore(s);setDone(true);}

const btn=(onClick,text,bg="#f97316")=>(<button onClick={onClick} style={{background:`linear-gradient(135deg,${bg},${bg}99)`,color:"#fff",border:"none",borderRadius:12,padding:"12px 20px",fontWeight:700,fontSize:14,cursor:"pointer",width:"100%",marginTop:8}}>{text}</button>);
const inp=(val,set,ph,multi)=>multi?(<textarea value={val} onChange={e=>set(e.target.value)} placeholder={ph} style={{width:"100%",padding:"10px 14px",background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:12,color:"#f0f0ff",fontSize:14,fontFamily:"inherit",outline:"none",resize:"none",height:80,boxSizing:"border-box"}}/>):(<input value={val} onChange={e=>set(e.target.value)} onKeyDown={e=>e.key==="Enter"&&tab==="tutor"&&ask()} placeholder={ph} style={{width:"100%",padding:"10px 14px",background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:12,color:"#f0f0ff",fontSize:14,fontFamily:"inherit",outline:"none",boxSizing:"border-box"}}/>);

return(<div style={{maxWidth:640,margin:"0 auto",paddingBottom:80}}>
<div style={{background:"rgba(0,0,0,0.4)",padding:"16px 20px",position:"sticky",top:0,zIndex:100}}>
<div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
<div style={{background:"linear-gradient(135deg,#f97316,#ec4899)",borderRadius:10,width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>🌍</div>
<div><div style={{fontWeight:900,fontSize:16,background:"linear-gradient(135deg,#fb923c,#f472b6)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Mantasha World Learn</div>
<div style={{fontSize:10,color:"rgba(255,255,255,0.4)"}}>by Mantasha Tehreem 🌸</div></div></div>
<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
<select value={lang.code} onChange={e=>setLang(LANGS.find(l=>l.code===e.target.value))} style={{padding:"5px 10px",borderRadius:99,border:"1px solid rgba(255,255,255,0.2)",background:"rgba(255,255,255,0.1)",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>
{LANGS.map(l=><option key={l.code} value={l.code} style={{background:"#1a1a2e"}}>{l.flag} {l.name}</option>)}</select>
<select value={subject} onChange={e=>setSubject(e.target.value)} style={{padding:"5px 10px",borderRadius:99,border:"1px solid rgba(255,255,255,0.2)",background:"rgba(255,255,255,0.1)",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>
{SUBJECTS.map(s=><option key={s} value={s} style={{background:"#1a1a2e"}}>{s}</option>)}</select>
{!isPremium&&(<div style={{padding:"5px 10px",borderRadius:99,background:"rgba(249,115,22,0.15)",border:"1px solid rgba(249,115,22,0.3)",fontSize:11,fontWeight:700,color:"#fb923c"}}>⚡ {usageLeft}/{FREE_LIMIT} free left</div>)}
{isPremium&&(<div style={{padding:"5px 10px",borderRadius:99,background:"rgba(16,185,129,0.15)",border:"1px solid rgba(16,185,129,0.3)",fontSize:11,fontWeight:700,color:"#10b981"}}>👑 Premium</div>)}</div></div>

{showUpgrade&&(<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}}>
<div style={{background:"#1a1a2e",borderRadius:20,padding:24,maxWidth:360,width:"100%",border:"1px solid rgba(249,115,22,0.3)"}}>
<div style={{fontSize:40,textAlign:"center",marginBottom:8}}>🔒</div>
<div style={{fontWeight:900,fontSize:20,textAlign:"center",marginBottom:6,background:"linear-gradient(135deg,#fb923c,#f472b6)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Daily Free Limit Reached</div>
<div style={{color:"rgba(255,255,255,0.5)",fontSize:13,textAlign:"center",marginBottom:18,lineHeight:1.6}}>You've used {FREE_LIMIT} free AI actions today. Upgrade to Premium for unlimited access!</div>
<div style={{background:"rgba(255,255,255,0.05)",borderRadius:12,padding:14,marginBottom:14,fontSize:13,lineHeight:2}}>
✅ Unlimited AI Tutor questions<br/>✅ Unlimited quizzes & notes<br/>✅ All 16 languages<br/>✅ Priority support</div>
<a href="https://razorpay.me/@mantasha" target="_blank" rel="noopener" onClick={()=>{setTimeout(()=>{if(confirm("Payment done? Click OK to unlock Premium.")){upgradeSuccess();}},500);}} style={{textDecoration:"none"}}>
<div style={{background:"linear-gradient(135deg,#f97316,#ec4899)",color:"#fff",borderRadius:12,padding:14,fontWeight:800,fontSize:15,textAlign:"center",cursor:"pointer"}}>Upgrade for ₹49/month</div></a>
<div onClick={()=>setShowUpgrade(false)} style={{textAlign:"center",marginTop:12,color:"rgba(255,255,255,0.4)",fontSize:13,cursor:"pointer"}}>Maybe later</div>
</div></div>)}

<div style={{padding:16}}>
{tab==="home"&&(<div>
<div style={{background:"linear-gradient(135deg,rgba(249,115,22,0.15),rgba(236,72,153,0.15))",borderRadius:20,padding:24,marginBottom:16,textAlign:"center",border:"1px solid rgba(249,115,22,0.2)"}}>
<div style={{fontSize:50,marginBottom:8}}>🌍</div>
<div style={{fontWeight:900,fontSize:20,marginBottom:6,background:"linear-gradient(135deg,#fb923c,#f472b6)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>World's Most Affordable AI Tutor</div>
<div style={{color:"rgba(255,255,255,0.5)",fontSize:13,lineHeight:1.7}}>Any subject • Your language • Free to start<br/><strong style={{color:"#fb923c"}}>ChatGPT=$20/mo vs Mantasha=$1/mo 🔥</strong></div></div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
{[{icon:"🤖",t:"tutor",title:"AI Tutor",desc:"Ask in your language",color:"#f97316"},{icon:"📝",t:"quiz",title:"Practice Quiz",desc:"Test yourself",color:"#ec4899"},{icon:"📚",t:"notes",title:"Smart Notes",desc:"Instant notes",color:"#10b981"},{icon:"🌍",t:"home",title:"16 Languages",desc:"Mother tongue learning",color:"#8b5cf6"}].map(item=>(<div key={item.t} onClick={()=>item.t!=="home"&&setTab(item.t)} style={{background:"rgba(255,255,255,0.05)",borderRadius:16,padding:16,cursor:"pointer",border:"1px solid rgba(255,255,255,0.08)"}}>
<div style={{fontSize:28,marginBottom:6}}>{item.icon}</div>
<div style={{fontWeight:800,color:item.color,fontSize:13}}>{item.title}</div>
<div style={{color:"rgba(255,255,255,0.35)",fontSize:11,marginTop:2}}>{item.desc}</div></div>))}</div></div>)}

{tab==="tutor"&&(<div>
<div style={{fontWeight:900,fontSize:18,marginBottom:12}}>🤖 AI Tutor — {lang.flag} {lang.name}</div>
<div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,border:"1px solid rgba(255,255,255,0.08)",minHeight:300,maxHeight:400,overflowY:"auto",padding:16,marginBottom:12}}>
{chat.length===0&&(<div style={{textAlign:"center",padding:"60px 20px",color:"rgba(255,255,255,0.3)"}}>
<div style={{fontSize:44,marginBottom:8}}>🤖</div>
<div style={{fontWeight:700}}>Ask anything in {lang.name}!</div></div>)}
{chat.map((msg,i)=>(<div key={i} style={{marginBottom:12,display:"flex",justifyContent:msg.r==="user"?"flex-end":"flex-start"}}>
<div style={{maxWidth:"82%",padding:"10px 14px",borderRadius:16,fontSize:14,lineHeight:1.7,background:msg.r==="user"?"linear-gradient(135deg,#f97316,#ec4899)":"rgba(255,255,255,0.08)"}}>{msg.t}</div></div>))}
{loading&&(<div style={{color:"rgba(255,255,255,0.4)",fontSize:13}}>Thinking in {lang.name}... ⏳</div>)}</div>
<div style={{display:"flex",gap:8}}>
<input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&ask()} placeholder={`Ask about ${subject}...`} style={{flex:1,padding:"10px 14px",background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:12,color:"#f0f0ff",fontSize:14,fontFamily:"inherit",outline:"none"}}/>
<button onClick={ask} disabled={loading} style={{background:"linear-gradient(135deg,#f97316,#ec4899)",color:"#fff",border:"none",borderRadius:12,padding:"10px 18px",cursor:"pointer",fontSize:18}}>➤</button></div></div>)}

{tab==="quiz"&&(<div>
<div style={{fontWeight:900,fontSize:18,marginBottom:12}}>📝 Quiz — {lang.flag} {lang.name}</div>
{!quiz?(<div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,padding:20,border:"1px solid rgba(255,255,255,0.08)"}}>
<div style={{marginBottom:12}}>{inp(qTopic,setQTopic,"Enter topic e.g. Newton Laws, Algebra...")}</div>
{btn(genQuiz,loading?"⏳ Generating...":"Generate 5 MCQs ✨")}</div>):(<div>
{done&&(<div style={{background:score>=4?"rgba(16,185,129,0.15)":"rgba(239,68,68,0.15)",borderRadius:16,padding:16,marginBottom:12,textAlign:"center",border:`2px solid ${score>=4?"#10b981":"#ef4444"}`}}>
<div style={{fontSize:36}}>{score>=4?"🎉":"💪"}</div>
<div style={{fontWeight:900,fontSize:28}}>{score}/5</div>
<div style={{color:"rgba(255,255,255,0.5)"}}>{score>=4?"Excellent! 🌟":"Keep practicing!"}</div></div>)}
{quiz.map((q,i)=>(<div key={i} style={{background:"rgba(255,255,255,0.04)",borderRadius:14,padding:16,marginBottom:10,border:"1px solid rgba(255,255,255,0.08)"}}>
<div style={{fontWeight:700,marginBottom:10,fontSize:14,lineHeight:1.5}}><span style={{color:"#f97316"}}>Q{i+1}. </span>{q.q}</div>
{q.options.map((opt,j)=>{const letter=["A","B","C","D"][j];const isSel=sel[i]===letter;const isOk=done&&letter===q.answer;const isBad=done&&isSel&&!isOk;
return(<div key={j} onClick={()=>!done&&setSel(s=>({...s,[i]:letter}))} style={{padding:"8px 12px",borderRadius:10,marginBottom:6,cursor:done?"default":"pointer",border:`1px solid ${isOk?"#10b981":isBad?"#ef4444":isSel?"#f97316":"rgba(255,255,255,0.1)"}`,background:isOk?"rgba(16,185,129,0.15)":isBad?"rgba(239,68,68,0.15)":isSel?"rgba(249,115,22,0.15)":"rgba(255,255,255,0.03)",fontSize:13,display:"flex",gap:8}}>
<span style={{fontWeight:700,color:isOk?"#10b981":isBad?"#ef4444":isSel?"#f97316":"rgba(255,255,255,0.3)"}}>{letter}.</span>{opt}
{isOk&&<span style={{marginLeft:"auto"}}>✅</span>}{isBad&&<span style={{marginLeft:"auto"}}>❌</span>}</div>);})}
{done&&<div style={{background:"rgba(249,115,22,0.1)",borderRadius:8,padding:"6px 10px",fontSize:12,color:"rgba(255,255,255,0.5)",marginTop:6,borderLeft:"3px solid #f97316"}}>💡 {q.explanation}</div>}</div>))}
{!done?btn(submit,"Submit ✓"):(<div style={{display:"flex",gap:8}}>
<button onClick={()=>{setQuiz(null);setQTopic("");setDone(false);setSel({});}} style={{flex:1,background:"linear-gradient(135deg,#f97316,#ec4899)",color:"#fff",border:"none",borderRadius:12,padding:12,fontWeight:700,cursor:"pointer"}}>New Quiz</button>
<button onClick={()=>{setDone(false);setSel({});}} style={{flex:1,background:"#10b981",color:"#fff",border:"none",borderRadius:12,padding:12,fontWeight:700,cursor:"pointer"}}>Retry</button></div>)}</div>)}</div>)}

{tab==="notes"&&(<div>
<div style={{fontWeight:900,fontSize:18,marginBottom:12}}>📚 Notes — {lang.flag} {lang.name}</div>
<div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,padding:20,border:"1px solid rgba(255,255,255,0.08)",marginBottom:12}}>
{inp(nTopic,setNTopic,"Enter topic...")}
{btn(genNotes,loading?`⏳ Writing in ${lang.name}...`:`Generate Notes ✨`)}</div>
{notes&&(<div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,padding:20,border:"1px solid rgba(255,255,255,0.08)"}}>
<div style={{fontWeight:800,color:"#10b981",marginBottom:10}}>📖 {nTopic}</div>
<div style={{fontSize:13,lineHeight:1.9,whiteSpace:"pre-wrap"}}>{notes}</div></div>)}</div>)}
</div>

<div style={{position:"fixed",bottom:0,left:0,right:0,background:"rgba(15,12,41,0.95)",borderTop:"1px solid rgba(255,255,255,0.08)",display:"flex",justifyContent:"space-around",padding:"10px 0 16px"}}>
{TABS.map(t=>(<button key={t.id} onClick={()=>setTab(t.id)} style={{background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"4px 12px",fontFamily:"inherit"}}>
<span style={{fontSize:20}}>{t.icon}</span>
<span style={{fontSize:10,fontWeight:700,color:tab===t.id?"#f97316":"rgba(255,255,255,0.3)"}}>{t.label}</span>
{tab===t.id&&<div style={{width:20,height:3,background:"linear-gradient(90deg,#f97316,#ec4899)",borderRadius:99}}/>}</button>))}</div>
<style>{`@keyframes b{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}`}</style>
</div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
  </html>
